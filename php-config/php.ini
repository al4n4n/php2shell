; Enable session upload progress (default on, but be explicit)
session.upload_progress.enabled = 1
session.upload_progress.cleanup = 0
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = 0

; Low memory limit to make OOM easier to trigger
memory_limit = 16M

; Short execution time for timeout trigger
max_execution_time = 5

; Session settings
session.save_handler = files
session.save_path = /tmp
session.auto_start = 0

; Don't ignore user abort (needed for connection-abort trigger)
ignore_user_abort = 0

; Error reporting
error_reporting = E_ALL
display_errors = On
log_errors = On
